<script>


  /* =====================================================
     SUPABASE CONFIG
  ====================================================== */

  const SUPABASE_URL =
    "https://voaktlbvwzliyfhxksdz.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_g_p2WWtAFq2GppJN-kLaWg_ccrxTkQ2";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );



  /* =====================================================
     DOM
  ====================================================== */

  const supportList =
    document.getElementById(
      "supportList"
    );


  const bagsTotal =
    document.getElementById(
      "bagsTotal"
    );


  const bagsTotalSmall =
    document.getElementById(
      "bagsTotalSmall"
    );


  const waterTotal =
    document.getElementById(
      "waterTotal"
    );


  const waterTotalSmall =
    document.getElementById(
      "waterTotalSmall"
    );


  const startDate =
    document.getElementById(
      "startDate"
    );


  const endDate =
    document.getElementById(
      "endDate"
    );


  const provinceFilter =
    document.getElementById(
      "provinceFilter"
    );


  const searchBtn =
    document.getElementById(
      "searchBtn"
    );


  const clearBtn =
    document.getElementById(
      "clearBtn"
    );


  const filterStatus =
    document.getElementById(
      "filterStatus"
    );


  const quickButtons =
    document.querySelectorAll(
      ".quick-btn"
    );


  const imageModal =
    document.getElementById(
      "imageModal"
    );


  const modalImage =
    document.getElementById(
      "modalImage"
    );


  const imageModalClose =
    document.getElementById(
      "imageModalClose"
    );



  /* =====================================================
     STATE
  ====================================================== */

  let allData = [];

  let currentData = [];

  let currentRange = "all";



  /* =====================================================
     FORMAT NUMBER
  ====================================================== */

  function formatNumber(
    number
  ) {

    return Number(
      number || 0
    ).toLocaleString(
      "th-TH"
    );

  }



  /* =====================================================
     ESCAPE HTML
  ====================================================== */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }



  /* =====================================================
     THAI DATE
  ====================================================== */

  function formatThaiDate(
    dateString
  ) {

    const date =
      new Date(
        dateString +
        "T00:00:00"
      );


    return date.toLocaleDateString(
      "th-TH",
      {
        day: "numeric",
        month: "short",
        year: "2-digit"
      }
    );

  }



  /* =====================================================
     GET TODAY
  ====================================================== */

  function getTodayString() {

    const date =
      new Date();


    const year =
      date.getFullYear();


    const month =
      String(
        date.getMonth() + 1
      ).padStart(
        2,
        "0"
      );


    const day =
      String(
        date.getDate()
      ).padStart(
        2,
        "0"
      );


    return `${year}-${month}-${day}`;

  }



  /* =====================================================
     LOAD DATA FROM SUPABASE
  ====================================================== */

  async function loadData() {

    supportList.innerHTML = `
      <div class="loading">
        กำลังโหลดข้อมูล...
      </div>
    `;


    const {
      data,
      error
    } =
      await supabaseClient

        .from(
          "support_records"
        )

        .select("*")

        .order(
          "date",
          {
            ascending: false
          }
        )

        .order(
          "id",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "Supabase error:",
        error
      );


      supportList.innerHTML = `

        <div class="empty">

          โหลดข้อมูลไม่สำเร็จ

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      `;

      return;

    }


    allData =
      data || [];


    applyFilters();

  }



  /* =====================================================
     APPLY FILTERS
  ====================================================== */

  function applyFilters() {

    let data =
      [...allData];


    const province =
      provinceFilter.value;


    if (province) {

      data =
        data.filter(
          item =>
            item.province ===
            province
        );

    }


    /* ===================================================
       QUICK RANGE
    ==================================================== */

    if (
      currentRange ===
      "today"
    ) {

      const today =
        getTodayString();


      data =
        data.filter(
          item =>
            item.date ===
            today
        );

    }


    if (
      currentRange ===
      "7"
    ) {

      const today =
        new Date();


      today.setHours(
        0,
        0,
        0,
        0
      );


      const start =
        new Date(
          today
        );


      start.setDate(
        start.getDate() - 6
      );


      data =
        data.filter(
          item => {

            const d =
              new Date(
                item.date +
                "T00:00:00"
              );


            return (
              d >= start &&
              d <= today
            );

          }
        );

    }


    if (
      currentRange ===
      "30"
    ) {

      const today =
        new Date();


      today.setHours(
        0,
        0,
        0,
        0
      );


      const start =
        new Date(
          today
        );


      start.setDate(
        start.getDate() - 29
      );


      data =
        data.filter(
          item => {

            const d =
              new Date(
                item.date +
                "T00:00:00"
              );


            return (
              d >= start &&
              d <= today
            );

          }
        );

    }


    /* ===================================================
       CUSTOM DATE
    ==================================================== */

    if (
      startDate.value ||
      endDate.value
    ) {

      const start =
        startDate.value
          ? new Date(
              startDate.value +
              "T00:00:00"
            )
          : null;


      const end =
        endDate.value
          ? new Date(
              endDate.value +
              "T23:59:59"
            )
          : null;


      data =
        data.filter(
          item => {

            const d =
              new Date(
                item.date +
                "T12:00:00"
              );


            if (
              start &&
              d < start
            ) {

              return false;

            }


            if (
              end &&
              d > end
            ) {

              return false;

            }


            return true;

          }
        );

    }


    currentData =
      data;


    renderDashboard(
      data
    );


    updateFilterStatus(
      data
    );

  }



  /* =====================================================
     RENDER DASHBOARD
  ====================================================== */

  function renderDashboard(
    data
  ) {


    /* ===================================================
       TOTAL
    ==================================================== */

    const totalBags =
      data.reduce(
        (
          sum,
          item
        ) =>
          sum +
          Number(
            item.bags || 0
          ),
        0
      );


    const totalWater =
      data.reduce(
        (
          sum,
          item
        ) =>
          sum +
          Number(
            item.water || 0
          ),
        0
      );


    bagsTotal.textContent =
      formatNumber(
        totalBags
      );


    bagsTotalSmall.textContent =
      formatNumber(
        totalBags
      );


    waterTotal.textContent =
      formatNumber(
        totalWater
      );


    waterTotalSmall.textContent =
      formatNumber(
        totalWater
      );


    /* ===================================================
       EMPTY
    ==================================================== */

    if (
      data.length === 0
    ) {

      supportList.innerHTML = `

        <div class="empty">

          ไม่พบข้อมูลตามเงื่อนไขที่เลือก

        </div>

      `;

      return;

    }


    /* ===================================================
       GROUP BY DATE
    ==================================================== */

    const groups = {};


    data.forEach(
      item => {

        if (
          !groups[item.date]
        ) {

          groups[item.date] =
            [];

        }


        groups[item.date].push(
          item
        );

      }
    );


    let html = "";


    Object.keys(groups)

      .sort()

      .reverse()

      .forEach(
        date => {


          html += `

            <div class="date-group">

              <div class="date-badge">

                ${formatThaiDate(
                  date
                )}

              </div>

          `;


          groups[date].forEach(
            (
              item,
              index
            ) => {


              const images =
                Array.isArray(
                  item.images
                )
                  ? item.images
                  : [];


              html += `

                <div class="support-item">


                  <div class="item-title">

                    ${index + 1}.

                    ${escapeHtml(
                      item.location
                    )}

                    จ.<strong>
                      ${escapeHtml(
                        item.province
                      )}
                    </strong>

                  </div>


                  <div class="item-amount">

                    • ถุงยังชีพ
                    <strong>
                      ${formatNumber(
                        item.bags
                      )}
                    </strong>
                    ถุง

                    &nbsp;&nbsp;•

                    น้ำดื่ม
                    <strong>
                      ${formatNumber(
                        item.water
                      )}
                    </strong>
                    แพ็ก

                  </div>


                  ${
                    images.length > 0
                      ? `

                        <div class="item-images">

                          ${images
                            .slice(
                              0,
                              3
                            )
                            .map(
                              url => `

                                <img
                                  src="${escapeHtml(
                                    url
                                  )}"
                                  alt="รูปภาพการสนับสนุน"
                                  loading="lazy"
                                  onclick="openImage('${escapeHtml(
                                    url
                                  )}')"
                                >

                              `
                            )
                            .join("")
                          }

                        </div>

                      `
                      : ""
                  }


                </div>

              `;

            }
          );


          html += `

            </div>

          `;

        }
      );


    supportList.innerHTML =
      html;

  }



  /* =====================================================
     FILTER STATUS
  ====================================================== */

  function updateFilterStatus(
    data
  ) {

    let text =
      "";


    if (
      currentRange ===
      "today"
    ) {

      text =
        "ข้อมูลวันนี้";

    }

    else if (
      currentRange ===
      "7"
    ) {

      text =
        "ข้อมูลย้อนหลัง 7 วัน";

    }

    else if (
      currentRange ===
      "30"
    ) {

      text =
        "ข้อมูลย้อนหลัง 30 วัน";

    }

    else {

      text =
        "ข้อมูลทั้งหมด";

    }


    if (
      startDate.value ||
      endDate.value
    ) {

      text =
        "ข้อมูลตามช่วงวันที่";

    }


    if (
      provinceFilter.value
    ) {

      text +=
        " • จังหวัด " +
        provinceFilter.value;

    }


    text +=
      ` • ${data.length} รายการ`;


    filterStatus.textContent =
      text;

  }



  /* =====================================================
     QUICK BUTTONS
  ====================================================== */

  quickButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {


          quickButtons.forEach(
            btn =>
              btn.classList.remove(
                "active"
              )
          );


          button.classList.add(
            "active"
          );


          currentRange =
            button.dataset.range;


          startDate.value =
            "";


          endDate.value =
            "";


          applyFilters();

        }
      );

    }
  );



  /* =====================================================
     SEARCH
  ====================================================== */

  searchBtn.addEventListener(
    "click",
    () => {

      quickButtons.forEach(
        btn =>
          btn.classList.remove(
            "active"
          )
      );


      currentRange =
        "all";


      applyFilters();

    }
  );



  /* =====================================================
     PROVINCE CHANGE
  ====================================================== */

  provinceFilter.addEventListener(
    "change",
    () => {

      applyFilters();

    }
  );



  /* =====================================================
     CLEAR FILTER
  ====================================================== */

  clearBtn.addEventListener(
    "click",
    () => {


      currentRange =
        "all";


      startDate.value =
        "";


      endDate.value =
        "";


      provinceFilter.value =
        "";


      quickButtons.forEach(
        btn =>
          btn.classList.remove(
            "active"
          )
      );


      document
        .querySelector(
          '[data-range="all"]'
        )
        .classList.add(
          "active"
        );


      applyFilters();

    }
  );



  /* =====================================================
     IMAGE MODAL
  ====================================================== */

  window.openImage =
    function(url) {

      modalImage.src =
        url;


      imageModal.classList.add(
        "show"
      );

    };



  function closeImage() {

    imageModal.classList.remove(
      "show"
    );


    modalImage.src =
      "";

  }



  imageModalClose.addEventListener(
    "click",
    closeImage
  );


  imageModal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        imageModal
      ) {

        closeImage();

      }

    }
  );


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Escape"
      ) {

        closeImage();

      }

    }
  );



  /* =====================================================
     START
  ====================================================== */

  loadData();


</script>


</body>

</html>
