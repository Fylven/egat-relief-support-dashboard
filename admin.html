<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    จัดการข้อมูล | EGAT Support Dashboard
  </title>


  <!-- =====================================================
       SUPABASE
  ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        "Noto Sans Thai",
        Tahoma,
        sans-serif;

      background: #f5f7f9;

      color: #123b70;

    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {

      margin: 14px 26px 18px;

      padding: 22px 28px;

      background: #ffc400;

      border-radius: 18px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      box-shadow:
        0 4px 12px rgba(0,0,0,.10);

    }


    .header-title {

      font-size: 28px;

      font-weight: 800;

    }


    .header-subtitle {

      margin-top: 5px;

      font-size: 16px;

      color: #444;

    }


    .back-btn {

      background: #ffffff;

      color: #123b70;

      text-decoration: none;

      padding: 12px 20px;

      border-radius: 10px;

      font-weight: 700;

      white-space: nowrap;

    }


    /* =====================================================
       CONTAINER
    ===================================================== */

    .container {

      max-width: 1250px;

      margin: 0 auto;

      padding: 0 20px 40px;

    }


    /* =====================================================
       CARD
    ===================================================== */

    .card {

      background: #ffffff;

      border-radius: 18px;

      padding: 25px;

      margin-bottom: 22px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.07);

    }


    .card-title {

      margin: 0 0 22px;

      font-size: 24px;

      font-weight: 800;

    }


    /* =====================================================
       FORM
    ===================================================== */

    .form-grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 20px;

    }


    .full {

      grid-column: 1 / -1;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 16px;

      font-weight: 700;

      color: #222;

    }


    input,
    select,
    textarea {

      width: 100%;

      border: 1px solid #d2d8df;

      border-radius: 9px;

      padding: 12px 14px;

      font-size: 16px;

      font-family: inherit;

      background: #ffffff;

    }


    input:focus,
    select:focus,
    textarea:focus {

      outline: none;

      border-color: #14589d;

      box-shadow:
        0 0 0 2px rgba(20,88,157,.10);

    }


    textarea {

      min-height: 110px;

      resize: vertical;

    }


    /* =====================================================
       IMAGE UPLOAD
    ===================================================== */

    .upload-box {

      border: 2px dashed #cbd3dc;

      border-radius: 12px;

      padding: 20px;

      background: #fafbfc;

      text-align: center;

      cursor: pointer;

      transition: .2s;

    }


    .upload-box:hover {

      border-color: #14589d;

      background: #f3f7fc;

    }


    .upload-box input {

      border: none;

      box-shadow: none;

      padding: 0;

      cursor: pointer;

    }


    .upload-help {

      margin-top: 8px;

      color: #777;

      font-size: 14px;

    }


    .image-preview {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 12px;

      margin-top: 15px;

    }


    .preview-item {

      position: relative;

      border-radius: 10px;

      overflow: hidden;

      background: #eee;

      border: 1px solid #ddd;

    }


    .preview-item img {

      display: block;

      width: 100%;

      height: 160px;

      object-fit: cover;

    }


    .remove-image-btn {

      position: absolute;

      top: 7px;

      right: 7px;

      width: 30px;

      height: 30px;

      border: none;

      border-radius: 50%;

      background: rgba(190,0,0,.90);

      color: white;

      cursor: pointer;

      font-size: 17px;

      font-weight: 700;

    }


    .image-count {

      margin-top: 10px;

      font-size: 14px;

      font-weight: 700;

      color: #555;

    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    .form-actions {

      display: flex;

      gap: 10px;

      margin-top: 22px;

    }


    .btn {

      border: none;

      border-radius: 9px;

      padding: 12px 20px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

    }


    .btn-primary {

      background: #087f3e;

      color: white;

    }


    .btn-primary:hover {

      background: #066b34;

    }


    .btn-secondary {

      background: #eeeeee;

      color: #222;

    }


    .btn-danger {

      background: #ffe1e1;

      color: #b42318;

    }


    .btn:disabled {

      opacity: .6;

      cursor: not-allowed;

    }


    /* =====================================================
       STATUS
    ===================================================== */

    .status {

      display: none;

      margin-bottom: 18px;

      padding: 13px 16px;

      border-radius: 9px;

      font-weight: 700;

    }


    .status.success {

      display: block;

      background: #e7f7ed;

      color: #087f3e;

    }


    .status.error {

      display: block;

      background: #fdecec;

      color: #b42318;

    }


    /* =====================================================
       DATA LIST
    ===================================================== */

    .date-group {

      margin-bottom: 30px;

    }


    .date-title {

      padding: 10px 0;

      border-bottom: 2px solid #ffc400;

      margin-bottom: 12px;

      font-size: 21px;

      font-weight: 900;

    }


    .data-item {

      border: 1px solid #dde2e7;

      border-radius: 12px;

      padding: 16px;

      margin-bottom: 12px;

      background: #ffffff;

    }


    .item-title {

      font-size: 17px;

      line-height: 1.65;

      font-weight: 700;

      color: #123b70;

    }


    .item-info {

      margin-top: 7px;

      font-size: 15px;

      color: #555;

    }


    .item-images {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-top: 12px;

      max-width: 650px;

    }


    .item-images img {

      width: 100%;

      height: 120px;

      object-fit: cover;

      border-radius: 9px;

      background: #eee;

    }


    .item-actions {

      display: flex;

      gap: 8px;

      margin-top: 13px;

    }


    .small-btn {

      border: none;

      border-radius: 7px;

      padding: 8px 14px;

      cursor: pointer;

      font-size: 14px;

      font-weight: 700;

    }


    .edit-btn {

      background: #eeeeee;

      color: #222;

    }


    .delete-btn {

      background: #ffe1e1;

      color: #b42318;

    }


    .empty {

      text-align: center;

      padding: 50px;

      color: #777;

    }


    .loading {

      text-align: center;

      padding: 50px;

      color: #777;

    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 800px) {

      .header {

        margin: 10px;

        padding: 18px;

        flex-direction: column;

        align-items: flex-start;

        gap: 15px;

      }


      .header-title {

        font-size: 22px;

      }


      .container {

        padding: 0 10px 30px;

      }


      .form-grid {

        grid-template-columns: 1fr;

      }


      .full {

        grid-column: auto;

      }


      .image-preview {

        grid-template-columns:
          repeat(2, 1fr);

      }


      .item-images {

        grid-template-columns:
          repeat(2, 1fr);

      }

    }


    @media (max-width: 500px) {

      .card {

        padding: 17px;

      }


      .image-preview {

        grid-template-columns: 1fr 1fr;

      }


      .item-images {

        grid-template-columns: 1fr;

      }


      .form-actions {

        flex-direction: column;

      }


      .btn {

        width: 100%;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div>

      <div class="header-title">
        เพิ่มข้อมูลสนับสนุน
      </div>

      <div class="header-subtitle">
        EGAT Support Dashboard
      </div>

    </div>


    <a
      href="index.html"
      class="back-btn"
    >
      ← กลับ Dashboard
    </a>

  </header>



  <main class="container">


    <!-- ===================================================
         STATUS
    ==================================================== -->

    <div
      id="status"
      class="status"
    ></div>



    <!-- ===================================================
         FORM
    ==================================================== -->

    <section class="card">

      <h2
        class="card-title"
        id="formTitle"
      >
        เพิ่มข้อมูลสนับสนุน
      </h2>


      <div class="form-grid">


        <!-- DATE -->

        <div>

          <label for="date">
            วันที่
          </label>

          <input
            type="date"
            id="date"
          >

        </div>



        <!-- PROVINCE -->

        <div>

          <label for="province">
            จังหวัด
          </label>

          <select
            id="province"
          >

            <option value="">
              -- เลือกจังหวัด --
            </option>

            <option>พระนครศรีอยุธยา</option>
            <option>สิงห์บุรี</option>
            <option>สุพรรณบุรี</option>
            <option>ลพบุรี</option>
            <option>อ่างทอง</option>
            <option>ระยอง</option>
            <option>ชลบุรี</option>
            <option>สระบุรี</option>
            <option>นครนายก</option>
            <option>ฉะเชิงเทรา</option>
            <option>ปราจีนบุรี</option>
            <option>จันทบุรี</option>
            <option>สระแก้ว</option>
            <option>ตราด</option>

          </select>

        </div>



        <!-- LOCATION -->

        <div class="full">

          <label for="location">
            สถานที่ / รายละเอียด
          </label>

          <textarea
            id="location"
            placeholder="เช่น วัดสุทธาราม ต.หอมหก อ.บางไทร"
          ></textarea>

        </div>



        <!-- BAGS -->

        <div>

          <label for="bags">
            ถุงยังชีพ (ถุง)
          </label>

          <input
            type="number"
            id="bags"
            min="0"
            value="0"
          >

        </div>



        <!-- WATER -->

        <div>

          <label for="water">
            น้ำดื่ม (แพ็ก)
          </label>

          <input
            type="number"
            id="water"
            min="0"
            value="0"
          >

        </div>



        <!-- STATUS -->

        <div>

          <label for="statusSelect">
            สถานะ
          </label>

          <select id="statusSelect">
            <option value="planned">ยังไม่ได้แจก</option>
            <option value="completed">แจกแล้ว</option>
          </select>

        </div>


        <!-- IMAGE UPLOAD -->

        <div class="full">

          <label>
            อัปโหลดรูปภาพ (สูงสุด 3 ภาพ)
          </label>


          <div class="upload-box">

            <input
              type="file"
              id="imageFiles"
              accept="image/*"
              multiple
            >

            <div class="upload-help">
              เลือกรูปภาพจากเครื่องได้ไม่เกิน 3 ภาพ
            </div>

          </div>


          <div
            id="imageCount"
            class="image-count"
          >
            รูปภาพ 0 / 3
          </div>


          <div
            id="imagePreview"
            class="image-preview"
          ></div>

        </div>


      </div>



      <!-- ACTION -->

      <div class="form-actions">

        <button
          type="button"
          class="btn btn-primary"
          id="saveBtn"
        >
          💾 บันทึกข้อมูล
        </button>


        <button
          type="button"
          class="btn btn-secondary"
          id="cancelBtn"
          style="display:none;"
        >
          ยกเลิกแก้ไข
        </button>

      </div>

    </section>



    <!-- ===================================================
         DATA LIST
    ==================================================== -->

    <section class="card">

      <h2 class="card-title">
        รายการข้อมูล
      </h2>


      <div id="records">

        <div class="loading">
          กำลังโหลดข้อมูล...
        </div>

      </div>

    </section>


  </main>



<script>


  /* =====================================================
     SUPABASE CONFIG
  ====================================================== */

  const SUPABASE_URL =
    "https://voaktlbvwzliyfhxksdz.supabase.co";


  /*
    ใส่ Publishable Key ของฟิล์มตรงนี้
    ต้องขึ้นต้นด้วย sb_publishable_
  */

  const SUPABASE_KEY =
    "sb_publishable_g_p2WWtAFq2GppJN-kLaWg_ccrxTkQ2";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );



  /* =====================================================
     DOM
  ====================================================== */

  const dateInput =
    document.getElementById("date");

  const provinceInput =
    document.getElementById("province");

  const locationInput =
    document.getElementById("location");

  const bagsInput =
    document.getElementById("bags");

  const waterInput =
    document.getElementById("water");

  const statusInput =
    document.getElementById("statusSelect");

  const imageFilesInput =
    document.getElementById("imageFiles");

  const imagePreview =
    document.getElementById("imagePreview");

  const imageCount =
    document.getElementById("imageCount");

  const saveBtn =
    document.getElementById("saveBtn");

  const cancelBtn =
    document.getElementById("cancelBtn");

  const recordsEl =
    document.getElementById("records");

  const statusEl =
    document.getElementById("status");

  const formTitle =
    document.getElementById("formTitle");



  /* =====================================================
     STATE
  ====================================================== */

  let editingId = null;


  /*
    รูปใหม่ที่ผู้ใช้เลือก
  */

  let selectedImageFiles = [];


  /*
    URL รูปเดิมจาก Database
  */

  let existingImages = [];



  /* =====================================================
     STATUS
  ====================================================== */

  function showStatus(
    message,
    type = "success"
  ) {

    statusEl.textContent =
      message;

    statusEl.className =
      "status " + type;


    setTimeout(
      () => {

        statusEl.className =
          "status";

      },
      4000
    );

  }



  /* =====================================================
     HTML ESCAPE
  ====================================================== */

  function escapeHtml(value) {

    return String(value ?? "")

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }



  /* =====================================================
     DATE FORMAT
  ====================================================== */

  function formatThaiDate(
    dateString
  ) {

    const date =
      new Date(
        dateString +
        "T00:00:00"
      );


    return date.toLocaleDateString(
      "th-TH",
      {
        day: "numeric",
        month: "short",
        year: "2-digit"
      }
    );

  }



  /* =====================================================
     IMAGE COUNT
  ====================================================== */

  function updateImageCount() {

    const total =
      existingImages.length +
      selectedImageFiles.length;


    imageCount.textContent =
      `รูปภาพ ${total} / 3`;

  }



  /* =====================================================
     RENDER IMAGE PREVIEW
  ====================================================== */

  function renderImagePreview() {

    imagePreview.innerHTML =
      "";


    /*
      OLD IMAGES
    */

    existingImages.forEach(
      (
        url,
        index
      ) => {

        const wrapper =
          document.createElement(
            "div"
          );

        wrapper.className =
          "preview-item";


        const img =
          document.createElement(
            "img"
          );

        img.src =
          url;

        img.alt =
          "รูปภาพเดิม";


        const removeBtn =
          document.createElement(
            "button"
          );

        removeBtn.type =
          "button";

        removeBtn.className =
          "remove-image-btn";

        removeBtn.textContent =
          "×";

        removeBtn.title =
          "เอารูปนี้ออก";


        removeBtn.addEventListener(
          "click",
          () => {

            existingImages.splice(
              index,
              1
            );

            renderImagePreview();

          }
        );


        wrapper.appendChild(
          img
        );

        wrapper.appendChild(
          removeBtn
        );

        imagePreview.appendChild(
          wrapper
        );

      }
    );



    /*
      NEW IMAGES
    */

    selectedImageFiles.forEach(
      (
        file,
        index
      ) => {

        const wrapper =
          document.createElement(
            "div"
          );

        wrapper.className =
          "preview-item";


        const img =
          document.createElement(
            "img"
          );


        const removeBtn =
          document.createElement(
            "button"
          );

        removeBtn.type =
          "button";

        removeBtn.className =
          "remove-image-btn";

        removeBtn.textContent =
          "×";

        removeBtn.title =
          "เอารูปนี้ออก";


        removeBtn.addEventListener(
          "click",
          () => {

            selectedImageFiles.splice(
              index,
              1
            );

            renderImagePreview();

          }
        );


        wrapper.appendChild(
          img
        );

        wrapper.appendChild(
          removeBtn
        );

        imagePreview.appendChild(
          wrapper
        );


        const reader =
          new FileReader();


        reader.onload =
          event => {

            img.src =
              event.target.result;

          };


        reader.readAsDataURL(
          file
        );

      }
    );


    updateImageCount();

  }



  /* =====================================================
     SELECT IMAGES
  ====================================================== */

  imageFilesInput.addEventListener(
    "change",
    () => {

      const files =
        Array.from(
          imageFilesInput.files
        );


      const total =
        existingImages.length +
        files.length;


      if (total > 3) {

        alert(
          `รายการนี้มีรูปอยู่แล้ว ${existingImages.length} ภาพ\n` +
          `สามารถเพิ่มได้อีกไม่เกิน ${3 - existingImages.length} ภาพ`
        );


        imageFilesInput.value =
          "";

        return;

      }


      selectedImageFiles =
        files;


      renderImagePreview();

    }
  );



  /* =====================================================
     UPLOAD IMAGES
  ====================================================== */

  async function uploadImages() {

    const uploadedUrls = [];


    for (
      const file of selectedImageFiles
    ) {


      /*
        ตรวจสอบไฟล์
      */

      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        throw new Error(
          "สามารถอัปโหลดได้เฉพาะไฟล์รูปภาพ"
        );

      }


      /*
        จำกัดขนาด 10 MB / รูป
      */

      if (
        file.size >
        10 * 1024 * 1024
      ) {

        throw new Error(
          `รูป ${file.name} มีขนาดเกิน 10 MB`
        );

      }


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      /*
        สร้างชื่อไฟล์ไม่ซ้ำ
      */

      const uniqueName =
        `${Date.now()}-${crypto.randomUUID()}.${extension}`;


      const filePath =
        `support/${uniqueName}`;


      /*
        Upload
      */

      const { error } =
        await supabaseClient
          .storage
          .from("support-images")
          .upload(
            filePath,
            file,
            {
              cacheControl:
                "3600",

              upsert:
                false
            }
          );


      if (error) {

        console.error(
          "Image upload error:",
          error
        );

        throw error;

      }


      /*
        Public URL
      */

      const { data } =
        supabaseClient
          .storage
          .from("support-images")
          .getPublicUrl(
            filePath
          );


      uploadedUrls.push(
        data.publicUrl
      );

    }


    return uploadedUrls;

  }



  /* =====================================================
     LOAD RECORDS
  ====================================================== */

  async function loadRecords() {

    recordsEl.innerHTML = `
      <div class="loading">
        กำลังโหลดข้อมูล...
      </div>
    `;


    const { data, error } =
      await supabaseClient

        .from(
          "support_records"
        )

        .select("*")

        .order(
          "date",
          {
            ascending: false
          }
        )

        .order(
          "id",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(error);


      recordsEl.innerHTML = `
        <div class="empty">
          โหลดข้อมูลไม่สำเร็จ
        </div>
      `;


      showStatus(
        "โหลดข้อมูลไม่สำเร็จ: " +
        error.message,
        "error"
      );


      return;

    }


    renderRecords(
      data || []
    );

  }



  /* =====================================================
     RENDER RECORDS
  ====================================================== */

  function renderRecords(
    data
  ) {

    if (
      data.length === 0
    ) {

      recordsEl.innerHTML = `
        <div class="empty">
          ยังไม่มีข้อมูล
        </div>
      `;

      return;

    }


    const groups = {};


    data.forEach(
      item => {

        if (
          !groups[item.date]
        ) {

          groups[item.date] =
            [];

        }


        groups[item.date].push(
          item
        );

      }
    );


    let html = "";


    Object.keys(groups)

      .sort()

      .reverse()

      .forEach(
        date => {


          html += `

            <div class="date-group">

              <div class="date-title">
                ${formatThaiDate(date)}
              </div>

          `;


          groups[date].forEach(
            (
              item,
              index
            ) => {


              const images =
                Array.isArray(
                  item.images
                )
                  ? item.images
                  : [];


              html += `

                <div class="data-item">


                  <div class="item-title">

                    ${index + 1}.

                    ${escapeHtml(
                      item.location
                    )}

                    จ.<strong>
                      ${escapeHtml(
                        item.province
                      )}
                    </strong>

                  </div>


                  <div class="item-info">

                    👜 ถุงยังชีพ:
                    <strong>
                      ${Number(
                        item.bags || 0
                      ).toLocaleString()}
                    </strong>
                    ถุง

                    &nbsp;&nbsp;|&nbsp;&nbsp;

                    💧 น้ำดื่ม:
                    <strong>
                      ${Number(
                        item.water || 0
                      ).toLocaleString()}
                    </strong>
                    แพ็ก

                  </div>


                  <div>
                    ${
                      item.status === "completed"
                        ? `<span class="status-badge status-completed">✓ แจกแล้ว</span>`
                        : `<span class="status-badge status-planned">🕐 ยังไม่ได้แจก</span>`
                    }
                  </div>


                  ${
                    images.length
                      ? `

                        <div class="item-images">

                          ${
                            images
                              .slice(
                                0,
                                3
                              )
                              .map(
                                url => `

                                  <img
                                    src="${escapeHtml(url)}"
                                    alt="รูปภาพการสนับสนุน"
                                    loading="lazy"
                                  >

                                `
                              )
                              .join("")
                          }

                        </div>

                      `
                      : ""
                  }


                  <div class="item-actions">

                    <button
                      class="small-btn edit-btn"
                      onclick="editRecord(${item.id})"
                    >
                      ✏️ แก้ไข
                    </button>


                    ${
                      item.status !== "completed"
                        ? `
                          <button
                            class="small-btn complete-btn"
                            onclick="completeRecord(${item.id})"
                          >
                            ✓ เสร็จสิ้น
                          </button>
                        `
                        : ""
                    }

                    <button
                      class="small-btn delete-btn"
                      onclick="deleteRecord(${item.id})"
                    >
                      🗑️ ลบ
                    </button>

                  </div>


                </div>

              `;

            }
          );


          html += `
            </div>
          `;

        }
      );


    recordsEl.innerHTML =
      html;

  }



  /* =====================================================
     SAVE
  ====================================================== */

  saveBtn.addEventListener(
    "click",
    async () => {


      const date =
        dateInput.value;


      const province =
        provinceInput.value;


      const location =
        locationInput.value.trim();


      const bags =
        Number(
          bagsInput.value
        ) || 0;


      const water =
        Number(
          waterInput.value
        ) || 0;


      /*
        VALIDATION
      */

      if (!date) {

        showStatus(
          "กรุณาเลือกวันที่",
          "error"
        );

        return;

      }


      if (!province) {

        showStatus(
          "กรุณาเลือกจังหวัด",
          "error"
        );

        return;

      }


      if (!location) {

        showStatus(
          "กรุณากรอกสถานที่",
          "error"
        );

        return;

      }


      const totalImages =
        existingImages.length +
        selectedImageFiles.length;


      if (
        totalImages > 3
      ) {

        showStatus(
          "สามารถมีรูปภาพได้ไม่เกิน 3 ภาพต่อรายการ",
          "error"
        );

        return;

      }


      /*
        DISABLE
      */

      saveBtn.disabled =
        true;


      saveBtn.textContent =
        "กำลังบันทึก...";


      try {


        /*
          UPLOAD NEW IMAGES
        */

        const newImages =
          await uploadImages();


        const images = [

          ...existingImages,

          ...newImages

        ].slice(
          0,
          3
        );


        /*
          PAYLOAD
        */

        const payload = {

          date,

          province,

          location,

          bags,

          water,

          status:
            statusInput.value || "planned",

          images

        };


        let result;


        /*
          EDIT
        */

        if (
          editingId
        ) {


          result =
            await supabaseClient

              .from(
                "support_records"
              )

              .update(
                payload
              )

              .eq(
                "id",
                editingId
              );

        }


        /*
          INSERT
        */

        else {


          result =
            await supabaseClient

              .from(
                "support_records"
              )

              .insert([
                {
                  ...payload,
                  status:
                    payload.status || "planned"
                }
              ]);

        }


        if (
          result.error
        ) {

          throw result.error;

        }


        /*
          SUCCESS
        */

        showStatus(

          editingId

            ? "แก้ไขข้อมูลเรียบร้อยแล้ว 🎉"

            : "เพิ่มข้อมูลเรียบร้อยแล้ว 🎉"

        );


        resetForm();


        await loadRecords();


      }

      catch (
        error
      ) {


        console.error(
          error
        );


        showStatus(

          "บันทึกข้อมูลไม่สำเร็จ: " +
          error.message,

          "error"

        );

      }


      finally {


        saveBtn.disabled =
          false;


        saveBtn.textContent =
          "💾 บันทึกข้อมูล";

      }

    }
  );



  /* =====================================================
     EDIT RECORD
  ====================================================== */

  window.editRecord =
    async function(id) {


      const {
        data,
        error
      } = await supabaseClient

        .from(
          "support_records"
        )

        .select("*")

        .eq(
          "id",
          id
        )

        .single();


      if (error) {

        showStatus(
          "โหลดข้อมูลไม่สำเร็จ: " +
          error.message,
          "error"
        );

        return;

      }


      editingId =
        id;


      dateInput.value =
        data.date || "";


      provinceInput.value =
        data.province || "";


      locationInput.value =
        data.location || "";


      bagsInput.value =
        data.bags || 0;


      waterInput.value =
        data.water || 0;

      statusInput.value =
        data.status || "planned";


      existingImages =
        Array.isArray(
          data.images
        )
          ? [
              ...data.images
            ].slice(
              0,
              3
            )
          : [];


      selectedImageFiles =
        [];


      imageFilesInput.value =
        "";


      renderImagePreview();


      formTitle.textContent =
        "แก้ไขข้อมูล";


      saveBtn.textContent =
        "💾 บันทึกการแก้ไข";


      cancelBtn.style.display =
        "inline-block";


      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });

    };



  /* =====================================================
     COMPLETE RECORD
  ====================================================== */

  window.completeRecord =
    async function(id) {

      const confirmed =
        confirm(
          "ยืนยันว่ารายการนี้แจกเสร็จสิ้นแล้วใช่หรือไม่?"
        );

      if (!confirmed) {

        return;

      }


      const {
        error
      } = await supabaseClient

        .from(
          "support_records"
        )

        .update({
          status: "completed"
        })

        .eq(
          "id",
          id
        );


      if (error) {

        console.error(error);

        showStatus(
          "เปลี่ยนสถานะไม่สำเร็จ: " +
          error.message,
          "error"
        );

        return;

      }


      showStatus(
        "ย้ายรายการไปยัง "แจกแล้ว" เรียบร้อยแล้ว 🎉"
      );


      await loadRecords();

    };



  /* =====================================================
     DELETE RECORD
  ====================================================== */

  window.deleteRecord =
    async function(id) {


      const confirmed =
        confirm(
          "ต้องการลบรายการนี้ใช่หรือไม่?"
        );


      if (!confirmed) {

        return;

      }


      const {
        error
      } = await supabaseClient

        .from(
          "support_records"
        )

        .delete()

        .eq(
          "id",
          id
        );


      if (error) {

        showStatus(
          "ลบข้อมูลไม่สำเร็จ: " +
          error.message,
          "error"
        );

        return;

      }


      showStatus(
        "ลบข้อมูลเรียบร้อยแล้ว"
      );


      await loadRecords();

    };



  /* =====================================================
     RESET FORM
  ====================================================== */

  function resetForm() {


    editingId =
      null;


    dateInput.value =
      "";


    provinceInput.value =
      "";


    locationInput.value =
      "";


    bagsInput.value =
      "0";


    waterInput.value =
      "0";

    statusInput.value =
      "planned";


    imageFilesInput.value =
      "";


    selectedImageFiles =
      [];


    existingImages =
      [];


    imagePreview.innerHTML =
      "";


    updateImageCount();


    formTitle.textContent =
      "เพิ่มข้อมูลสนับสนุน";


    saveBtn.textContent =
      "💾 บันทึกข้อมูล";


    cancelBtn.style.display =
      "none";

  }



  /* =====================================================
     CANCEL
  ====================================================== */

  cancelBtn.addEventListener(
    "click",
    resetForm
  );



  /* =====================================================
     START
  ====================================================== */

  loadRecords();


</script>


</body>

</html>
